[package]
name = "wave"
version = "0.1.21"
edition = "2024"
publish = false
resolver = "2"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
radiant = { git = "https://github.com/PORTALSURFER/radiant.git", rev = "c1343993c973bdece3e8cd469415b0d08c7f6cf1", default-features = false, optional = true }
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "a69df15593a5cb9320993dde8d9908bfe857a9f6", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[build-dependencies]
toybox = { git = "https://github.com/PORTALSURFER/toybox.git", rev = "a69df15593a5cb9320993dde8d9908bfe857a9f6", default-features = false }

[features]
default = ["radiant-gui"]
radiant-gui = ["dep:radiant", "toybox/radiant-gui"]
vst3 = ["toybox/radiant-vst3", "radiant-gui"]
screenshot-test = ["radiant-gui", "dep:image"]

[lints.rust]
warnings = "deny"
missing_docs = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"
