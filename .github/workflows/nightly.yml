name: WAVE nightly scheduler

on:
  schedule:
    - cron: "0 20 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      force:
        description: Dispatch a nightly even when main already matches the latest nightly (testing only)
        required: false
        default: false
        type: boolean

# The scheduler only dispatches the existing release workflow. That workflow
# owns all source, signing, notarization, and PortalSurfer secrets.
permissions:
  actions: write

concurrency:
  group: wave-nightly-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch credentialed WAVE release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail
          only_if_changed=true
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${FORCE}" == "true" ]]; then
            only_if_changed=false
          fi
          payload="{\"ref\":\"main\",\"inputs\":{\"channel\":\"nightly\",\"publish\":\"true\",\"only_if_changed\":\"${only_if_changed}\"}}"
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            --data "${payload}"
